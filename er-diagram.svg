<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background-color: #1e1e2e; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f3f4f6" font-size="24" font-weight="bold">Diagrama Entidad-Relación - Kanban System</text>

  <!-- USUARIO ENTITY -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="260" height="260" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="2"/>
    <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="url(#headerGrad)" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
    <text x="130" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Usuario</text>
    
    <text x="15" y="75" fill="#38bdf8" font-size="13" font-weight="bold">PK  int Id</text>
    <line x1="15" y1="85" x2="245" y2="85" stroke="#374151" stroke-width="1"/>
    <text x="15" y="115" fill="#e5e7eb" font-size="13">string Nombre</text>
    <text x="15" y="145" fill="#e5e7eb" font-size="13">string Correo</text>
    <text x="15" y="175" fill="#9ca3af" font-size="13">string PasswordHash</text>
    <text x="15" y="205" fill="#9ca3af" font-size="13">string PasswordSalt</text>
  </g>

  <!-- PROYECTO ENTITY -->
  <g transform="translate(670, 100)" filter="url(#shadow)">
    <rect width="280" height="260" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 45 L 0 45 Z" fill="url(#headerGrad)" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
    <text x="140" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Proyecto</text>

    <text x="15" y="75" fill="#38bdf8" font-size="13" font-weight="bold">PK  int Id</text>
    <line x1="15" y1="85" x2="265" y2="85" stroke="#374151" stroke-width="1"/>
    <text x="15" y="115" fill="#e5e7eb" font-size="13">string Nombre</text>
    <text x="15" y="145" fill="#e5e7eb" font-size="13">string Descripcion</text>
    <text x="15" y="175" fill="#e5e7eb" font-size="13">DateTime FechaInicio</text>
    <text x="15" y="205" fill="#e5e7eb" font-size="13">DateTime? FechaFinPrevista</text>
    <text x="15" y="235" fill="#e5e7eb" font-size="13">string Estado</text>
  </g>

  <!-- COLUMNA ENTITY -->
  <g transform="translate(670, 410)" filter="url(#shadow)">
    <rect width="280" height="200" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 45 L 0 45 Z" fill="url(#headerGrad)" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
    <text x="140" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Columna</text>

    <text x="15" y="75" fill="#38bdf8" font-size="13" font-weight="bold">PK  int Id</text>
    <line x1="15" y1="85" x2="265" y2="85" stroke="#374151" stroke-width="1"/>
    <text x="15" y="115" fill="#e5e7eb" font-size="13">string Nombre</text>
    <text x="15" y="145" fill="#e5e7eb" font-size="13">double Orden</text>
    <text x="15" y="175" fill="#f59e0b" font-size="13" font-weight="bold">FK  int ProyectoId</text>
  </g>

  <!-- TAREA ENTITY -->
  <g transform="translate(50, 400)" filter="url(#shadow)">
    <rect width="300" height="230" rx="10" fill="url(#cardGrad)" stroke="#4f46e5" stroke-width="2"/>
    <path d="M 0 0 L 300 0 L 300 45 L 0 45 Z" fill="url(#headerGrad)" clip-path="inset(0 0 0 0 round 10px 10px 0 0)"/>
    <text x="150" y="28" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Tarea</text>

    <text x="15" y="70" fill="#38bdf8" font-size="13" font-weight="bold">PK  int Id</text>
    <line x1="15" y1="78" x2="285" y2="78" stroke="#374151" stroke-width="1"/>
    <text x="15" y="100" fill="#e5e7eb" font-size="13">string Titulo</text>
    <text x="15" y="125" fill="#e5e7eb" font-size="13">string Descripcion</text>
    <text x="15" y="150" fill="#e5e7eb" font-size="13">string Prioridad</text>
    <text x="15" y="175" fill="#e5e7eb" font-size="13">double Orden</text>
    <text x="15" y="198" fill="#f59e0b" font-size="13" font-weight="bold">FK  int? ResponsableId</text>
    <text x="15" y="218" fill="#f59e0b" font-size="13" font-weight="bold">FK  int ColumnaId</text>
  </g>

  <!-- RELATION LINES -->
  <!-- Proyecto 1 a N Columna -->
  <path d="M 810 360 L 810 410" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="820" y="375" width="70" height="20" rx="4" fill="#374151"/>
  <text x="855" y="389" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">1 : N</text>

  <!-- Columna 1 a N Tarea -->
  <path d="M 670 515 L 350 515" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="480" y="495" width="70" height="20" rx="4" fill="#374151"/>
  <text x="515" y="509" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">1 : N</text>

  <!-- Usuario 1 a N Tarea -->
  <path d="M 180 360 L 180 400" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="190" y="365" width="80" height="20" rx="4" fill="#374151"/>
  <text x="230" y="379" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">1 : N (0..1)</text>

</svg>
