<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="Sakai logo" class="mb-3 w-6rem flex-shrink-0">
                    <div class="text-900 text-3xl font-medium mb-3">Bienvenido a Kanban Agile</div>
                    <span class="text-600 font-medium">Inicia sesión para continuar</span>
                </div>

                <div class="w-full md:w-30rem mx-auto">
                    <label for="email1" class="block text-900 font-medium mb-2">Correo (ej. admin&#64;kanban.com)</label>
                    <input id="email1" type="text" [(ngModel)]="email" placeholder="Correo electrónico" pInputText class="w-full mb-3" style="padding:1rem">

                    <label for="password1" class="block text-900 font-medium mb-2">Contraseña (ej. Password123!)</label>
                    <p-password id="password1" [(ngModel)]="password" placeholder="Contraseña" [toggleMask]="true" [feedback]="false" styleClass="mb-3 w-full" inputStyleClass="w-full p-3"></p-password>

                    <div class="flex align-items-center justify-content-between mb-5">
                        <div class="flex align-items-center">
                            <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme1">Recordarme</label>
                        </div>
                        <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div *ngIf="errorMsg" class="p-error mb-4 font-bold">{{errorMsg}}</div>

                    <button pButton pRipple [label]="loading ? 'Ingresando...' : 'Iniciar Sesión'" 
                            [disabled]="loading || !email || !password" 
                            (click)="onLogin()" 
                            class="w-full p-3 text-xl block"></button>
                </div>
            </div>
        </div>
    </div>
</div>
